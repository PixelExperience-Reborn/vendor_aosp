name: AOSP17 PE product source-owner preflight

on:
  push:
    branches:
      - port/a17-vendor-envsetup-20261102
    paths:
      - 'config/common.mk'
      - 'config/fonts.mk'
      - 'fonts/**'
      - 'tools/a17_verify_source_consumers.py'
      - '.github/workflows/aosp17-product-source-owners.yml'
  pull_request:
    paths:
      - 'config/common.mk'
      - 'config/fonts.mk'
      - 'fonts/**'
      - 'tools/a17_verify_source_consumers.py'
      - '.github/workflows/aosp17-product-source-owners.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-owners:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Get official Android repo tool
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$RUNNER_TEMP/repo"
          chmod +x "$RUNNER_TEMP/repo"
      - name: Initialize pinned PE-Reborn AOSP17 platform profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aosp"
          cd "$RUNNER_TEMP/aosp"
          "$RUNNER_TEMP/repo" init -q --no-clone-bundle --partial-clone --clone-filter=blob:none \
            -u https://github.com/PixelExperience-Reborn/manifest \
            -b port/a17-aosp17-manifest-20261102 \
            -m aosp17_pe_p1_timezonepicker.xml
          "$RUNNER_TEMP/repo" manifest -o "$RUNNER_TEMP/effective-manifest.xml"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "effective-manifest.xml")).getroot()
          projects = {p.get("path") or p.get("name"): p.get("name") for p in root.findall("project")}
          for path, owner in (
              ("external/e2fsprogs", "platform/external/e2fsprogs"),
              ("packages/apps/QuickAccessWallet", "platform/packages/apps/QuickAccessWallet"),
              ("packages/modules/ExtServices", "platform/packages/modules/ExtServices"),
          ):
              assert projects.get(path) == owner, f"Unexpected AOSP17 module owner: {path}"
          assert projects.get("external/avb") == "platform/external/avb"
          print("PASS: official AOSP17 wallet/storage/ExtServices and AVB source ownership")
          PY
      - name: Sync targeted upstream AOSP17 package and font sources only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aosp"
          "$RUNNER_TEMP/repo" sync -c -j4 --no-tags --fail-fast \
            external/e2fsprogs \
            packages/apps/QuickAccessWallet \
            packages/modules/ExtServices \
            external/google-fonts/arbutus-slab \
            external/google-fonts/lato \
            external/google-fonts/rubik \
            external/google-fonts/zilla-slab \
            external/google-fonts/lustria \
            external/google-fonts/karla \
            external/google-fonts/fraunces \
            external/google-fonts/big-shoulders-text \
            external/google-fonts/barlow
      - name: Verify PE font/package owner references (source-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/a17_verify_source_consumers.py "$RUNNER_TEMP/aosp"
